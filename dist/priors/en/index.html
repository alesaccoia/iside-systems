<body class="priors">

<div class="pbar">
  <a class="home" href="/en">
    <span class="glyph"></span>
    <span><b>Priors</b><span>← Back to the site</span></span>
  </a>
  <span class="sep"></span>
  <div class="tools">
    <button class="pb" data-mode="select" aria-pressed="true">Select</button>

    <button class="pb" data-mode="comment" aria-pressed="false">Note</button>
  </div>
  <div class="right">
    <select class="psel" id="pexamples" aria-label="Examples"></select>
    <button class="pb" id="pclearev">Clear evidence</button>
    <button class="pb" id="pexport">Export</button>
    <button class="pb" id="pimport">Import</button>
    <button class="pb danger" id="preset">Clear</button>
    <span class="plang"><a href="/priors">EN / IT</a></span>
  </div>
</div>

<div class="pstage">
  <div class="pcanvas">
    <div class="pworld" id="world"><svg id="wires" xmlns="http://www.w3.org/2000/svg"></svg></div>
  </div>
  <aside class="ppanel" id="panel"></aside>
</div>

<div class="psmall"><div class="in"></div></div>
