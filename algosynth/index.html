<body class="algo">
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-584NQHC3"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<div id="app">
  <header class="topbar">
    <a class="brand" href="/">
      <span class="glyph"></span>
      <span><b>AlgoSynth</b><span>&larr; Torna al sito</span></span>
    </a>
    <span class="sep"></span>
    <div class="transport">
      <button id="playToggle" class="btn" data-play="Play" data-pause="Pausa" aria-pressed="false">Play</button>
      <label class="control"><span>BPM</span>
        <input id="bpm" type="number" min="40" max="300" value="120"></label>
      <label class="control"><span>Swing</span>
        <input id="swing" type="range" min="0" max="0.6" step="0.01" value="0"></label>
      <label class="control"><span>Step</span>
        <input id="steps" type="number" min="8" max="64" value="16"></label>
    </div>
    <div class="io">
      <button id="guideBtn" class="btn">Guida</button>
      <button id="audioToggle" class="btn" aria-pressed="true">Audio interno</button>
      <label class="control"><span>MIDI out</span><select id="midiOut"></select></label>
      <button id="panic" class="btn subtle">Panic</button>
      <a class="btn subtle" href="/algosynth/en">IT / EN</a>
    </div>
  </header>

  <main class="main">
    <aside class="sidebar">
      <button id="addPerc" class="btn full">+ Traccia ritmica</button>
      <button id="addMelodic" class="btn full">+ Traccia melodica</button>
      <div class="divider"></div>
      <div class="pattern-controls">
        <div class="section-title">Pattern</div>
        <div class="row">
          <button id="newPattern" class="btn">Nuovo</button>
          <button id="dupPattern" class="btn subtle">Duplica</button>
          <button id="renamePattern" class="btn subtle">Rinomina</button>
          <button id="deletePattern" class="btn subtle">Elimina</button>
        </div>
        <select id="patternList" size="6" class="list"></select>
        <div class="row"><button id="queueNext" class="btn full">Accoda al prossimo giro</button></div>
      </div>
      <div class="divider"></div>
      <div class="song-controls">
        <div class="section-title">Song</div>
        <div class="row">
          <label class="control"><span>Modo</span>
            <select id="playMode">
              <option value="pattern">Pattern</option>
              <option value="song">Song</option>
            </select></label>
        </div>
        <div class="row">
          <button id="addToSong" class="btn">Aggiungi sel.</button>
          <label class="control"><span>Ripetizioni</span>
            <input id="songRepeats" type="number" min="1" value="4"></label>
        </div>
        <ol id="songList" class="song-list"></ol>
        <div class="row"><button id="clearSong" class="btn subtle">Svuota song</button></div>
      </div>
      <div class="divider"></div>
      <button id="saveState" class="btn full subtle">Salva</button>
      <button id="loadState" class="btn full subtle">Carica</button>
      <button id="clearState" class="btn full subtle">Azzera</button>
      <div class="hint">Per il MIDI serve un browser con Web MIDI (Chrome o Edge) su https. L'audio interno funziona ovunque.</div>
    </aside>

    <section class="tracks"><div id="tracksContainer" class="tracks-container"></div></section>
  </main>

  <div class="asmall"><div class="in"></div></div>
  <canvas id="viz"></canvas>
</div>

<div class="aguide" id="guide" hidden></div>

<script type="module" src="/algosynth/js/shell.js"></script>
<script type="module" src="/algosynth/js/main.js"></script>
</body>
</html>
